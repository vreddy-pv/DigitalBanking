databaseChangeLog:
  - changeSet:
      id: 001-create-complaints-table
      author: banking-team
      changes:
        - createTable:
            tableName: complaints
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ticket_id
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: account_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_id
                  type: VARCHAR(36)
              - column:
                  name: product_line
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: complaint_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACCEPTED
                  constraints:
                    nullable: false
              - column:
                  name: ops_analyst_id
                  type: VARCHAR(36)
              - column:
                  name: resolution
                  type: TEXT
              - column:
                  name: outcome
                  type: VARCHAR(20)
              - column:
                  name: sla_deadline
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP

  - changeSet:
      id: 002-create-complaints-indexes
      author: banking-team
      changes:
        - createIndex:
            indexName: idx_complaints_user_id
            tableName: complaints
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_complaints_status
            tableName: complaints
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_complaints_created_at
            tableName: complaints
            columns:
              - column:
                  name: created_at
        - createIndex:
            indexName: idx_complaints_transaction_id
            tableName: complaints
            columns:
              - column:
                  name: transaction_id
