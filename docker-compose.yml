services:

  # ── Observability Stack ───────────────────────────────────────────────────────

  datadog-agent:
    image: gcr.io/datadoghq/agent:7.50.3
    container_name: datadog-agent
    environment:
      DD_API_KEY: ${DD_API_KEY:-}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: digital-banking-platform
      DD_TAGS: "env:${ENV:-dev},team:platform,version:${APP_VERSION:-2.0.0}"
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_PROCESS_AGENT_ENABLED: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent,name:langfuse-postgres,name:langfuse-redis"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./datadog-conf.d:/etc/datadog-agent/conf.d:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "8126:8126/tcp"
      - "8125:8125/udp"
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "agent", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  langfuse-postgres:
    image: postgres:16-alpine
    container_name: langfuse-postgres
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse_secret}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  langfuse-redis:
    image: redis:7-alpine
    container_name: langfuse-redis
    command: redis-server --appendonly yes
    volumes:
      - langfuse_redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  langfuse-server:
    image: langfuse/langfuse:2
    container_name: langfuse-server
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse_secret}@langfuse-postgres:5432/langfuse
      REDIS_CONNECTION_STRING: redis://langfuse-redis:6379
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme_in_production_32chars__}
      NEXTAUTH_URL: http://localhost:3001
      LOG_LEVEL: info
      TELEMETRY_ENABLED: "false"
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - banking-network

  # ─────────────────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: digital-banking-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: my-super-secret-key-for-jwt-tokens-please-change-in-production-minimum-256-bits
      JWT_EXPIRATION: 900000
      JAVA_TOOL_OPTIONS: "-javaagent:/dd-java-agent.jar"
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
      DD_SERVICE: auth-service
      DD_ENV: ${ENV:-dev}
      DD_VERSION: ${APP_VERSION:-2.0.0}
      DD_AGENT_HOST: datadog-agent
      DD_AGENT_PORT: "8126"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8001/api/v1/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - banking-network

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: account-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JAVA_TOOL_OPTIONS: "-javaagent:/dd-java-agent.jar"
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
      DD_SERVICE: account-service
      DD_ENV: ${ENV:-dev}
      DD_VERSION: ${APP_VERSION:-2.0.0}
      DD_AGENT_HOST: datadog-agent
      DD_AGENT_PORT: "8126"
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - banking-network

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: transaction-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transaction_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      JAVA_TOOL_OPTIONS: "-javaagent:/dd-java-agent.jar"
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
      DD_SERVICE: transaction-service
      DD_ENV: ${ENV:-dev}
      DD_VERSION: ${APP_VERSION:-2.0.0}
      DD_AGENT_HOST: datadog-agent
      DD_AGENT_PORT: "8126"
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - banking-network

  ledger-service:
    build:
      context: .
      dockerfile: ledger-service/Dockerfile
    container_name: ledger-service
    depends_on:
      postgres:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JAVA_TOOL_OPTIONS: "-javaagent:/dd-java-agent.jar"
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
      DD_SERVICE: ledger-service
      DD_ENV: ${ENV:-dev}
      DD_VERSION: ${APP_VERSION:-2.0.0}
      DD_AGENT_HOST: datadog-agent
      DD_AGENT_PORT: "8126"
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - banking-network

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    container_name: customer-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/customer_db
      DATABASE_USERNAME: customer_user
      DATABASE_PASSWORD: password
      JWT_SECRET: ${JWT_SECRET:-mySecretKey12345678901234567890123456789012}
      SERVICE_PORT: 8005
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8005/api/v1/customers/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - banking-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SERVER_PORT: 8000
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: auth-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://auth-service:8001
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/v1/auth/**
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: account-service
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://account-service:8002
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/api/v1/accounts/**
      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: transaction-service
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://transaction-service:8003
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: Path=/api/v1/transactions/**
      SPRING_CLOUD_GATEWAY_ROUTES_3_ID: ledger-service
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://ledger-service:8004
      SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: Path=/api/v1/ledger/**
      SPRING_CLOUD_GATEWAY_ROUTES_4_ID: complaint-service
      SPRING_CLOUD_GATEWAY_ROUTES_4_URI: http://complaint-service:8011
      SPRING_CLOUD_GATEWAY_ROUTES_4_PREDICATES_0: Path=/api/v1/complaints/**
      SPRING_CLOUD_GATEWAY_ROUTES_5_ID: ai-agent-service
      SPRING_CLOUD_GATEWAY_ROUTES_5_URI: http://ai-agent-service:8010
      SPRING_CLOUD_GATEWAY_ROUTES_5_PREDICATES_0: Path=/api/v1/chat/**
      SPRING_CLOUD_GATEWAY_ROUTES_6_ID: loan-service
      SPRING_CLOUD_GATEWAY_ROUTES_6_URI: http://loan-service:8012
      SPRING_CLOUD_GATEWAY_ROUTES_6_PREDICATES_0: Path=/api/v1/loans/**
      SPRING_CLOUD_GATEWAY_ROUTES_7_ID: ops-service
      SPRING_CLOUD_GATEWAY_ROUTES_7_URI: http://ops-service:8013
      SPRING_CLOUD_GATEWAY_ROUTES_7_PREDICATES_0: Path=/api/v1/ops/**
      SPRING_CLOUD_GATEWAY_ROUTES_8_ID: casa-mcp-server
      SPRING_CLOUD_GATEWAY_ROUTES_8_URI: http://casa-mcp-server:8014
      SPRING_CLOUD_GATEWAY_ROUTES_8_PREDICATES_0: Path=/mcp/casa/**
      SPRING_CLOUD_GATEWAY_ROUTES_9_ID: ml-mcp-server
      SPRING_CLOUD_GATEWAY_ROUTES_9_URI: http://ml-mcp-server:8015
      SPRING_CLOUD_GATEWAY_ROUTES_9_PREDICATES_0: Path=/mcp/ml/**
      SPRING_CLOUD_GATEWAY_ROUTES_10_ID: cul-mcp-server
      SPRING_CLOUD_GATEWAY_ROUTES_10_URI: http://cul-mcp-server:8016
      SPRING_CLOUD_GATEWAY_ROUTES_10_PREDICATES_0: Path=/mcp/cul/**
      SPRING_CLOUD_GATEWAY_ROUTES_11_ID: complaint-mcp-server
      SPRING_CLOUD_GATEWAY_ROUTES_11_URI: http://complaint-mcp-server:8017
      SPRING_CLOUD_GATEWAY_ROUTES_11_PREDICATES_0: Path=/mcp/complaint/**
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health 2>/dev/null || curl -f http://localhost:8000/actuator 2>/dev/null || curl -s http://localhost:8000/ >/dev/null || true"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - banking-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: digital-banking-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://notification_user:password@postgres:5432/notification_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_QUEUE: transaction_events
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${NOTIFICATION_EMAIL:-noreply@digitalbanking.com}
      SMTP_PASSWORD: ${NOTIFICATION_PASSWORD:-dummy-password}
      SMTP_FROM: noreply@digitalbanking.com
      SERVICE_PORT: 8006
      SERVICE_HOST: 0.0.0.0
      ENV: development
      LOG_LEVEL: INFO
    ports:
      - "8006:8006"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8006/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - banking-network

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: analytics-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRANSACTION_DB_URL: postgresql://analytics_user:password@postgres:5432/transaction_db
      LEDGER_DB_URL: postgresql://analytics_user:password@postgres:5432/ledger_db
      SERVICE_PORT: 8007
      SERVICE_HOST: 0.0.0.0
      LOG_LEVEL: INFO
    ports:
      - "8007:8007"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8007/api/v1/analytics/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - banking-network

  audit-service:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    container_name: audit-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://audit_user:password@postgres:5432/audit_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_QUEUE: audit_events
      RABBITMQ_EXCHANGE: banking.events
      RABBITMQ_ROUTING_KEY: transaction.created
      SERVICE_PORT: 8009
      SERVICE_HOST: 0.0.0.0
      LOG_LEVEL: INFO
      ENV: development
    ports:
      - "8009:8009"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8009/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - banking-network

  compliance-service:
    build:
      context: .
      dockerfile: compliance-service/Dockerfile
    container_name: compliance-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://compliance_user:password@postgres:5432/compliance_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_QUEUE: compliance_events
      RABBITMQ_EXCHANGE: banking.events
      RABBITMQ_ROUTING_KEY: transaction.created
      SERVICE_PORT: 8008
      SERVICE_HOST: 0.0.0.0
      LOG_LEVEL: INFO
      ENV: development
      HIGH_VALUE_THRESHOLD: 50000
      LARGE_WITHDRAWAL_THRESHOLD: 25000
      FREQUENT_TX_WINDOW_MINUTES: 60
      FREQUENT_TX_COUNT: 5
      RAPID_TX_WINDOW_MINUTES: 10
      RAPID_TX_COUNT: 3
      STRUCTURING_LOWER: 40000
      STRUCTURING_UPPER: 49999
      STRUCTURING_COUNT: 3
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - banking-network

  digital-banking-ui:
    build:
      context: ./digital-banking-ui
      dockerfile: Dockerfile
    container_name: digital-banking-ui
    depends_on:
      auth-service:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4200
      API_BASE_URL: http://api-gateway:8000
      AUTH_API_URL: http://api-gateway:8000/api/v1/auth
      ACCOUNT_API_URL: http://api-gateway:8000/api/v1/accounts
      TRANSACTION_API_URL: http://api-gateway:8000/api/v1/transactions
      LEDGER_API_URL: http://api-gateway:8000/api/v1/ledger
    ports:
      - "4200:4200"
      - "4201:4200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4200"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - banking-network

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: digital-banking-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - banking-network

  grafana:
    image: grafana/grafana:10.1.0
    container_name: digital-banking-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - banking-network

  complaint-service:
    build:
      context: .
      dockerfile: complaint-service/Dockerfile
    container_name: complaint-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/complaint_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      JAVA_TOOL_OPTIONS: "-javaagent:/dd-java-agent.jar"
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
      DD_SERVICE: complaint-service
      DD_ENV: ${ENV:-dev}
      DD_VERSION: ${APP_VERSION:-2.0.0}
      DD_AGENT_HOST: datadog-agent
      DD_AGENT_PORT: "8126"
    ports:
      - "8011:8011"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8011/api/v1/complaints/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - banking-network

  redis:
    image: redis:7.2-alpine
    container_name: digital-banking-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-network

  ai-agent-service:
    build:
      context: ./ai-agent-service
      dockerfile: Dockerfile
    container_name: ai-agent-service
    depends_on:
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      complaint-service:
        condition: service_healthy
      loan-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      casa-mcp-server:
        condition: service_healthy
      ml-mcp-server:
        condition: service_healthy
      cul-mcp-server:
        condition: service_healthy
      complaint-mcp-server:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MODEL: claude-sonnet-4-6
      MAX_TOKENS: 4096
      AUTH_SERVICE_URL: http://auth-service:8001
      ACCOUNT_SERVICE_URL: http://account-service:8002
      TRANSACTION_SERVICE_URL: http://transaction-service:8003
      LEDGER_SERVICE_URL: http://ledger-service:8004
      COMPLAINT_SERVICE_URL: http://complaint-service:8011
      LOAN_SERVICE_URL: http://loan-service:8012
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379
      SESSION_TTL_SECONDS: 1800
      MAX_CONVERSATION_TURNS: 10
      CASA_MCP_URL: http://casa-mcp-server:8014
      ML_MCP_URL: http://ml-mcp-server:8015
      CUL_MCP_URL: http://cul-mcp-server:8016
      COMPLAINT_MCP_URL: http://complaint-mcp-server:8017
      # ── Observability ──
      ENV: ${ENV:-dev}
      APP_VERSION: ${APP_VERSION:-2.0.0}
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
      DD_SERVICE: ai-agent-service
      DD_AGENT_HOST: datadog-agent
      DD_AGENT_PORT: "8126"
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: http://langfuse-server:3000
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - banking-network

  loan-service:
    build:
      context: .
      dockerfile: loan-service/Dockerfile
    container_name: loan-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/loan_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JAVA_TOOL_OPTIONS: "-javaagent:/dd-java-agent.jar"
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
      DD_SERVICE: loan-service
      DD_ENV: ${ENV:-dev}
      DD_VERSION: ${APP_VERSION:-2.0.0}
      DD_AGENT_HOST: datadog-agent
      DD_AGENT_PORT: "8126"
    ports:
      - "8012:8012"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8012/api/v1/loans/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - banking-network

  ops-service:
    build:
      context: .
      dockerfile: ops-service/Dockerfile
    container_name: ops-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      complaint-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ops_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      COMPLAINT_SERVICE_URL: http://complaint-service:8011
      JAVA_TOOL_OPTIONS: "-javaagent:/dd-java-agent.jar"
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-false}
      DD_SERVICE: ops-service
      DD_ENV: ${ENV:-dev}
      DD_VERSION: ${APP_VERSION:-2.0.0}
      DD_AGENT_HOST: datadog-agent
      DD_AGENT_PORT: "8126"
    ports:
      - "8013:8013"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8013/api/v1/ops/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - banking-network

  # ── MCP Adapter Layer ────────────────────────────────────────────────────────

  casa-mcp-server:
    build:
      context: ./casa-mcp-server
      dockerfile: Dockerfile
    container_name: casa-mcp-server
    depends_on:
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8002
      TRANSACTION_SERVICE_URL: http://transaction-service:8003
    ports:
      - "8014:8014"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8014/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - banking-network

  ml-mcp-server:
    build:
      context: ./ml-mcp-server
      dockerfile: Dockerfile
    container_name: ml-mcp-server
    depends_on:
      loan-service:
        condition: service_healthy
    environment:
      LOAN_SERVICE_URL: http://loan-service:8012
    ports:
      - "8015:8015"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8015/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - banking-network

  cul-mcp-server:
    build:
      context: ./cul-mcp-server
      dockerfile: Dockerfile
    container_name: cul-mcp-server
    depends_on:
      loan-service:
        condition: service_healthy
    environment:
      LOAN_SERVICE_URL: http://loan-service:8012
    ports:
      - "8016:8016"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8016/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - banking-network

  complaint-mcp-server:
    build:
      context: ./complaint-mcp-server
      dockerfile: Dockerfile
    container_name: complaint-mcp-server
    depends_on:
      complaint-service:
        condition: service_healthy
    environment:
      COMPLAINT_SERVICE_URL: http://complaint-service:8011
    ports:
      - "8017:8017"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8017/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - banking-network

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  redis_data:
  langfuse_postgres_data:
  langfuse_redis_data:

networks:
  banking-network:
    driver: bridge
